<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </radialGradient>
    <radialGradient id="sun" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="55%" stop-color="#ffc23d"/>
      <stop offset="100%" stop-color="#ff8c1a"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- compass ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#2a3242" stroke-width="10"/>
  <g stroke="#3a4252" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="96"  x2="256" y2="118"/>
    <line x1="256" y1="394" x2="256" y2="416"/>
    <line x1="96"  y1="256" x2="118" y2="256"/>
    <line x1="394" y1="256" x2="416" y2="256"/>
  </g>
  <!-- north marker -->
  <polygon points="256,108 244,150 268,150" fill="#ff6b6b"/>
  <!-- sun -->
  <circle cx="256" cy="262" r="78" fill="url(#sun)"/>
  <g stroke="#ffc23d" stroke-width="14" stroke-linecap="round">
    <line x1="256" y1="150" x2="256" y2="178"/>
    <line x1="256" y1="346" x2="256" y2="374"/>
    <line x1="144" y1="262" x2="172" y2="262"/>
    <line x1="340" y1="262" x2="368" y2="262"/>
    <line x1="177" y1="183" x2="197" y2="203"/>
    <line x1="315" y1="321" x2="335" y2="341"/>
    <line x1="335" y1="183" x2="315" y2="203"/>
    <line x1="197" y1="321" x2="177" y2="341"/>
  </g>
</svg>
